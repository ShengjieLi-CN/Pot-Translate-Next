name: Package Windows
on:
    workflow_dispatch:
    push:
        branches: [master, main]
        tags: ['v*']
permissions:
    contents: read
jobs:
    windows-msi:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.18.0
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
                  components: rustfmt
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked
            - run: ./.scripts/build-msi.ps1
            - name: Build SnipDo extension
              shell: pwsh
              run: |
                  Compress-Archive -Path .scripts/snipdo/pot.json,.scripts/snipdo/pot.png,.scripts/snipdo/pot.ps1 -DestinationPath .scripts/snipdo/pot.zip -Force
                  Move-Item .scripts/snipdo/pot.zip .scripts/snipdo/pot.pbar -Force
            - uses: actions/upload-artifact@v4
              with:
                  name: windows-x64-zh-CN
                  path: |
                      src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*_zh-CN.msi
                      .scripts/snipdo/pot.pbar
                  if-no-files-found: error
